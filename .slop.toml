# slop — agentic code quality linter
# https://github.com/JordanGunn/agent-slop-lint
# Profile: lax

# Root directory (default: ".")
root = "."

# Languages to analyze (default: auto-detect all supported)
# Supported: python, javascript, typescript, go, rust, java, c_sharp
# languages = ["python", "typescript"]

# Global file exclusions. Build output and generated code are not ours to fix,
# and manifest.generated.ts alone is 162 KB of machine-written lookup table that
# would dominate every file-level metric here.
exclude = [
  "**/dist/**",
  "**/target/**",
  "**/node_modules/**",
  "**/public/**",
  "**/*.generated.ts",
]

# Scoped waivers keep exceptional findings visible without weakening global
# thresholds. Prefer a local allow_up_to ceiling over an unbounded waiver.
# [[waivers]]
# id = "parser-npath"
# path = "src/parser/**"
# rule = "structural.complexity.npath"
# allow_up_to = 1200
# reason = "Parser branch shape mirrors grammar alternatives."
# expires = "2026-09-01"

[rules.structural.complexity]
enabled = true
cyclomatic_threshold = 20       # fail if any function CCX > this
cognitive_threshold = 25        # fail if any function CogC > this
npath_threshold = 1000         # fail if any function NPath > this
severity = "error"

[rules.structural.class.complexity]
enabled = true
threshold = 80              # fail if any class WMC exceeds this
severity = "error"

[rules.structural.class.coupling]
enabled = true
threshold = 15
severity = "error"

[rules.structural.class.inheritance.depth]
enabled = true
threshold = 6
severity = "error"

[rules.structural.class.inheritance.children]
enabled = true
threshold = 20
severity = "error"

# Reported, not gated, and the distinction is the whole point. `hotspot` is not
# a threshold: slop classifies a file into that quadrant when its complexity AND
# its LOC growth are both at or above the 75th percentile *of the files it
# measured this run*. Roughly a quarter of the tree is above each cut by
# construction, and the two overlap, so the quadrant is never empty however good
# the code gets — driving complexity down everywhere just moves the cut down
# with it. Worse for a gate: `loc_delta` counts commits in the window, so a
# refactor that halves a file's complexity still raises its churn and can leave
# it ranked higher than before.
#
# A ranking answers "what would I refactor next", which is worth printing on
# every run. It cannot answer "is this branch clean", which is what an error
# severity claims. So it stays enabled and stays visible as an advisory.
[rules.structural.hotspots]
enabled = true
since = "90 days ago"
min_commits = 3
fail_on_quadrant = ["hotspot"]
severity = "warning"

[rules.structural.packages]
enabled = true
# languages = ["python"]        # optional: restrict to a subset of slop's supported languages
max_distance = 0.85
fail_on_zone = ["pain"]
severity = "warning"

[rules.structural.deps]
enabled = true
fail_on_cycles = true
severity = "error"

[rules.structural.local_imports]
enabled = true
# threshold = 0     # allow up to N local imports per file before flagging
severity = "warning"
# ── Python: local imports are a genuine idiom in three common situations ──────
# 1. Optional / heavy dependencies deferred until the feature is actually used:
#    [[waivers]]
#    id = "local-imports-optional-dep"
#    path = "src/your_package/**"
#    rule = "structural.local_imports"
#    reason = "Heavy optional dependency deferred to avoid import-time cost when wheels are absent."
#
# 2. CLI subcommand handlers deferring imports for startup speed:
#    [[waivers]]
#    id = "local-imports-cli-startup"
#    path = "src/your_package/cli.py"
#    rule = "structural.local_imports"
#    reason = "CLI handlers defer imports so users pay the cost only for the subcommand invoked."
#
# 3. Test functions that import inside the body for monkeypatching:
#    [[waivers]]
#    id = "local-imports-test-monkeypatch"
#    path = "tests/**"
#    rule = "structural.local_imports"
#    reason = "Import inside body required so the test can monkeypatch before code under test runs."
# ─────────────────────────────────────────────────────────────────────────────

[rules.structural.redundancy]
enabled = true
min_shared = 3      # minimum shared non-trivial callees between two sibling functions
min_score = 0.5     # minimum overlap ratio (shared / max callee count)
severity = "warning"

[rules.structural.types.sentinels]
enabled = true
max_cardinality = 8   # flag sentinel str params with ≤ 8 distinct call-site values
require_str_annotation = true
severity = "warning"

[rules.structural.types.hidden_mutators]
enabled = true
require_type_annotation = true   # only flag params with explicit collection types
min_mutations = 1
severity = "warning"

[rules.structural.types.escape_hatches]
enabled = true
threshold = 0.30    # flag files where > 30% of annotations use escape-hatch types
min_annotations = 5
severity = "warning"

[rules.structural.duplication]
enabled = true
threshold = 0.05    # flag when > 5% of functions are Type-2 clones
min_leaf_nodes = 10 # ignore trivially short functions
min_cluster_size = 2
severity = "warning"

[rules.structural.god_module]
enabled = true
threshold = 20      # flag files with more than this many top-level definitions
severity = "warning"

[rules.structural.orphans]
enabled = false
min_confidence = "high"
severity = "warning"

[rules.information.volume]
enabled = true
threshold = 3000         # fail if any function V exceeds this
# token_weight_alpha = 0.0   # > 0 tightens threshold for terse-identifier functions
severity = "error"

[rules.information.difficulty]
enabled = true
threshold = 50        # fail if any function D exceeds this
severity = "error"

[rules.information.magic_literals]
enabled = true
threshold = 3       # flag functions with > 3 distinct non-trivial numeric literals
severity = "warning"

[rules.information.section_comments]
enabled = true
threshold = 2       # flag functions with more than this many section-divider comments
severity = "warning"

[rules.lexical.stutter]
enabled = true
min_overlap_tokens = 2   # flag identifiers repeating ≥ N tokens from enclosing scope
severity = "warning"

[rules.lexical.verbosity]
enabled = true
max_mean_tokens = 3.0   # flag functions where mean word-tokens-per-identifier > this
min_identifiers = 5     # skip functions with fewer identifiers than this
severity = "warning"

[rules.lexical.tersity]
enabled = true
max_density = 0.50      # flag functions where > 50% of identifiers are ≤ max_len chars
max_len = 2
min_identifiers = 5
# Tuned for Rust and TypeScript rather than left at the default. The rule was
# firing on `e` for an error binding, `fs` for `std::fs`, and `Ok` — all three
# are idiomatic Rust that a reviewer would ask you to put back. `a`/`b` are the
# conventional pair in a comparator, and `id`/`m`/`t` recur across this codebase.
allow_list = [
  "i", "j", "k", "x", "y", "z", "n", "ok", "Ok",
  "e", "fs", "io", "a", "b", "id", "m", "t", "to", "of", "on", "up",
]
severity = "warning"
