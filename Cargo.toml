# Cargo workspace root.
#
# The orchestrator started as a single crate under `src-tauri/`. It isn't one
# any more: the tool protocol needs a manifest parser and an RPC transport that
# both the orchestrator *and* every tool repo will depend on, plus a reference
# tool to test them against. Those are libraries, not Tauri code, so they live
# outside `src-tauri/` and are shared through this workspace.
#
# Note this moves the build directory from `src-tauri/target/` to `target/` —
# one shared directory for every member, which is the whole point (the Tauri
# dependency tree gets compiled once, not once per crate).

[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/*",
    "examples/echo-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Firelight Innovations"]
license = "UNLICENSED"

# Versions are pinned here and referenced from members as `serde.workspace =
# true`, so two crates in this repo can't drift onto different releases of the
# same dependency and force cargo to compile both.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
semver = "1"

# Lint levels are declared here and inherited by every member through
# `lints.workspace = true`, for the same reason dependencies are: five copies of
# a `#![warn(...)]` block in five lib.rs files drift apart, and the drift is
# invisible until one crate starts accepting what another rejects.
#
# Note what is *not* here. Clippy's correctness, suspicious, style, complexity
# and perf groups are already on by default, and `cargo clippy -- -D warnings`
# in CI is what promotes them to errors. Listing them again would say nothing.
# `pedantic` is deliberately left off: it is worth having, but it is a much
# larger baseline than the rules below, which are the ones STANDARDS.md §10
# already committed to in writing.
[workspace.lints.clippy]
# §5 — no `unwrap()` or `expect()` on anything that depends on the filesystem, a
# process, or user input. Clippy cannot tell a genuine invariant from a fallible
# call, so two escape hatches carry the difference: tests are exempted wholesale
# in clippy.toml, and the one invariant shipping code leans on — a lock this
# process owns being un-poisoned — is answered once in `src-tauri/src/sync.rs`
# (and `crates/helve-rpc/src/sync.rs`) rather than at each of its forty sites.
unwrap_used = "warn"
expect_used = "warn"

# §4.1 (`missing_docs`) and §5 modules (`unreachable_pub`) are deliberately NOT
# here, because they are not workspace-wide rules even though they read like
# ones. Both are about a *published surface*: what another repository imports
# and has to understand. `crates/helve-rpc` and `crates/helve-tool-manifest`
# have one; `src-tauri` does not — it is an application whose `pub` items exist
# to cross module boundaries inside a single binary.
#
# Enabling them workspace-wide produced 1115 warnings, 816 of them
# `unreachable_pub` against src-tauri alone, which is noise rather than debt.
# They are set instead at the top of each protocol crate's lib.rs, where they
# describe something true. Cargo does not allow a member to inherit
# `[workspace.lints]` and add its own, so the crate-level attribute is the only
# way to have both.
