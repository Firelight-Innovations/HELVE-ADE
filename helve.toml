# The Helve stack manifest.
#
# This file is the single source of truth for *which* components make up the
# stack and *which version* of each one this orchestrator expects. Helve is
# multi-repo: every component below lives in its own repository and cuts its own
# tagged releases. We pin exact semantic versions here rather than tracking a
# branch tip, so a given checkout of `orchestrator` always describes one
# reproducible stack.

[stack]
name = "Helve"
version = "0.1.0"

# Where local checkouts of the component repos live, relative to this file.
# The default layout is every Helve repo sitting as a sibling of `orchestrator/`.
checkout-root = ".."


# --- Runtime -----------------------------------------------------------------
# `kind = "runtime"` means this code ships inside a finished game.

[[tool]]
id = "engine"
name = "Helve Engine"
kind = "runtime"
repo = "https://github.com/Firelight-Innovations/helve-engine"
version = "0.1.0"
description = "Runtime core — lighting, audio playback, spatial audio built in."


# --- Development tools -------------------------------------------------------
# `kind = "dev-tool"` means authoring-time only; never shipped with a game.

[[tool]]
id = "forger"
name = "Forger"
kind = "dev-tool"
repo = "https://github.com/Firelight-Innovations/helve-forger"
version = "0.1.0"
description = "Technical design software — specs out the stack and its boundaries."

[[tool]]
id = "journeyman"
name = "Journeyman"
kind = "dev-tool"
repo = "https://github.com/Firelight-Innovations/helve-journeyman"
version = "0.1.0"
description = "Game design software — design prototyping, rough playable systems."

[[tool]]
id = "turner"
name = "Turner"
kind = "dev-tool"
repo = "https://github.com/Firelight-Innovations/helve-turner"
version = "0.1.0"
description = "Procedural art system — generates art from an artist's rough shape."

[[tool]]
id = "scrivener"
name = "Scrivener"
kind = "dev-tool"
repo = "https://github.com/Firelight-Innovations/helve-scrivener"
version = "0.1.0"
description = "Narrative and dialogue authoring tool."

[[tool]]
id = "quickener"
name = "Quickener"
kind = "dev-tool"
repo = "https://github.com/Firelight-Innovations/helve-quickener"
version = "0.1.0"
description = "NPC behavior and AI tooling."

[[tool]]
id = "wright"
name = "Wright"
kind = "dev-tool"
repo = "https://github.com/Firelight-Innovations/helve-wright"
version = "0.1.0"
description = "Audio authoring and composition tooling."
