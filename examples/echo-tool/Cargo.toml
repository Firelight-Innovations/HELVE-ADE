[package]
name = "kaava-echo-tool"
description = "Reference tool core — the smallest thing that satisfies the OpenKaava tool protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Lint levels come from [workspace.lints] in the root Cargo.toml.
[lints]
workspace = true

[[bin]]
name = "kaava-echo-tool"
path = "src/main.rs"

[dependencies]
kaava-rpc = { path = "../../crates/kaava-rpc" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The end-to-end test lives here rather than in kaava-rpc because
# `CARGO_BIN_EXE_kaava-echo-tool` is only set for tests inside the package that
# declares the binary — which is what lets the test spawn the real stub instead
# of guessing a path into target/.
serde_json.workspace = true
