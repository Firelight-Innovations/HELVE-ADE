[package]
name = "helve-echo-tool"
description = "Reference tool core — the smallest thing that satisfies the Helve tool protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "helve-echo-tool"
path = "src/main.rs"

[dependencies]
helve-rpc = { path = "../../crates/helve-rpc" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The end-to-end test lives here rather than in helve-rpc because
# `CARGO_BIN_EXE_helve-echo-tool` is only set for tests inside the package that
# declares the binary — which is what lets the test spawn the real stub instead
# of guessing a path into target/.
serde_json.workspace = true
